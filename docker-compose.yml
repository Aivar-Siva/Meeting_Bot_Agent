version: "3.9"

services:
  # ── Attendee's own Postgres (matches dev hardcoded creds) ─────
  attendee-postgres:
    image: postgres:15.3-alpine
    container_name: attendee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: attendee_development
      POSTGRES_USER: attendee_development_user
      POSTGRES_PASSWORD: attendee_development_user
    volumes:
      - attendee_pg:/data/postgres
    networks:
      - botnet

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - botnet

  # ── Attendee app ──────────────────────────────────────────────
  attendee-app:
    build: ./attendee
    container_name: attendee-app
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      - POSTGRES_HOST=attendee-postgres
      - REDIS_URL=redis://redis:6379/5
      - DJANGO_SETTINGS_MODULE=attendee.settings.development
      - ENABLE_CHROME_SANDBOX=false
      - DJANGO_SECRET_KEY=${ATTENDEE_SECRET_KEY}
      - ALLOWED_HOSTS=localhost,attendee-app,${EC2_PUBLIC_IP}
      - DJANGO_ALLOWED_HOSTS=*
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY}
    command: python manage.py runserver 0.0.0.0:8000
    entrypoint: []
    depends_on:
      - attendee-postgres
      - redis
    networks:
      - botnet

  attendee-worker:
    build: ./attendee
    image: meeting_bot_agent-attendee-app
    container_name: attendee-worker
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=attendee-postgres
      - REDIS_URL=redis://redis:6379/5
      - DJANGO_SETTINGS_MODULE=attendee.settings.development
      - ENABLE_CHROME_SANDBOX=false
      - DJANGO_SECRET_KEY=${ATTENDEE_SECRET_KEY}
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY}
    command: celery -A attendee worker -l INFO
    depends_on:
      - attendee-postgres
      - redis
    networks:
      - botnet

  attendee-webpage-streamer:
    build: ./attendee
    image: meeting_bot_agent-attendee-app
    container_name: attendee-webpage-streamer
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=attendee.settings.development
      - ENABLE_CHROME_SANDBOX=false
    command: python bots/webpage_streamer/run_webpage_streamer.py
    entrypoint: []
    networks:
      - botnet

  # ── Qdrant ────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - botnet

  # ── FastAPI (uses RDS for our data) ───────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://meetingbot:MeetingBot2026!@${RDS_ENDPOINT}/meetingbot
      - ATTENDEE_BASE_URL=http://attendee-app:8000
      - ATTENDEE_API_KEY=${ATTENDEE_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - BEDROCK_LAMBDA_URL=${BEDROCK_LAMBDA_URL}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - EC2_PUBLIC_IP=${EC2_PUBLIC_IP}
      - LM_STUDIO_URL=${LM_STUDIO_URL}
    depends_on:
      - attendee-app
      - qdrant
    networks:
      - botnet

networks:
  botnet:
    driver: bridge

volumes:
  attendee_pg:
  qdrant_data:
