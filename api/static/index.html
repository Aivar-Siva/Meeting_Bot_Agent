<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Bot Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }
  header { background: #1a1d27; border-bottom: 1px solid #2d3148; padding: 16px 32px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 20px; font-weight: 600; color: #fff; }
  header span { background: #6366f1; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 99px; }
  nav { display: flex; gap: 4px; padding: 16px 32px 0; border-bottom: 1px solid #2d3148; background: #1a1d27; }
  nav button { background: none; border: none; color: #94a3b8; padding: 10px 20px; cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; transition: all .2s; }
  nav button.active { color: #6366f1; border-bottom-color: #6366f1; }
  nav button:hover { color: #e2e8f0; }
  .page { display: none; padding: 32px; max-width: 900px; margin: 0 auto; }
  .page.active { display: block; }
  .card { background: #1a1d27; border: 1px solid #2d3148; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #fff; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
  input, select { width: 100%; background: #0f1117; border: 1px solid #2d3148; border-radius: 8px; padding: 10px 14px; color: #e2e8f0; font-size: 14px; outline: none; transition: border .2s; }
  input:focus, select:focus { border-color: #6366f1; }
  .btn { background: #6366f1; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; cursor: pointer; transition: background .2s; }
  .btn:hover { background: #4f46e5; }
  .btn:disabled { background: #374151; cursor: not-allowed; }
  .btn-outline { background: none; border: 1px solid #2d3148; color: #94a3b8; }
  .btn-outline:hover { border-color: #6366f1; color: #6366f1; background: none; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .form-group { margin-bottom: 16px; }
  .status-badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; }
  .status-joining { background: #1e3a5f; color: #60a5fa; }
  .status-in_call { background: #14532d; color: #4ade80; }
  .status-ended { background: #1f2937; color: #9ca3af; }
  .transcript-box { background: #0f1117; border: 1px solid #2d3148; border-radius: 8px; padding: 16px; max-height: 300px; overflow-y: auto; font-size: 13px; line-height: 1.8; }
  .utterance { margin-bottom: 8px; }
  .utterance .speaker { color: #6366f1; font-weight: 600; }
  .utterance .text { color: #e2e8f0; }
  .live-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .insight-section { margin-bottom: 16px; }
  .insight-section h3 { font-size: 13px; color: #6366f1; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .insight-section p { font-size: 14px; color: #e2e8f0; line-height: 1.6; }
  .tag { display: inline-block; background: #1e293b; border: 1px solid #2d3148; border-radius: 6px; padding: 4px 10px; font-size: 12px; color: #94a3b8; margin: 3px; }
  .action-item { background: #0f1117; border-left: 3px solid #6366f1; padding: 10px 14px; border-radius: 0 8px 8px 0; margin-bottom: 8px; font-size: 13px; }
  .action-item .owner { color: #6366f1; font-weight: 600; }
  .search-result { background: #0f1117; border: 1px solid #2d3148; border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .search-result .meta { font-size: 12px; color: #6366f1; margin-bottom: 6px; }
  .search-result .excerpt { font-size: 13px; color: #94a3b8; line-height: 1.6; }
  .answer-box { background: #1e293b; border: 1px solid #6366f1; border-radius: 8px; padding: 16px; margin-bottom: 16px; font-size: 14px; line-height: 1.7; }
  .meeting-list { list-style: none; }
  .meeting-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #2d3148; }
  .meeting-item:last-child { border-bottom: none; }
  .meeting-item .info { font-size: 13px; }
  .meeting-item .id { color: #6366f1; font-family: monospace; font-size: 12px; }
  .meeting-item .url { color: #94a3b8; font-size: 12px; margin-top: 2px; }
  .meeting-item .actions { display: flex; gap: 8px; }
  .ws-log { background: #0f1117; border: 1px solid #2d3148; border-radius: 8px; padding: 12px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #4ade80; }
  .error { color: #f87171; font-size: 13px; margin-top: 8px; }
  .success { color: #4ade80; font-size: 13px; margin-top: 8px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #374151; border-top-color: #6366f1; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .risk { background: #1f1010; border-left: 3px solid #f87171; padding: 8px 12px; border-radius: 0 6px 6px 0; margin-bottom: 6px; font-size: 13px; color: #fca5a5; }
  .sentiment { display: flex; gap: 8px; flex-wrap: wrap; }
  .sentiment-item { background: #0f1117; border: 1px solid #2d3148; border-radius: 8px; padding: 8px 12px; font-size: 12px; }
  .sentiment-item .name { color: #94a3b8; }
  .sentiment-item .val { font-weight: 600; }
  .positive { color: #4ade80; }
  .neutral { color: #facc15; }
  .negative { color: #f87171; }
  .chat-bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
  .chat-user { align-self: flex-end; background: #6366f1; color: #fff; border-bottom-right-radius: 4px; }
  .chat-bot { align-self: flex-start; background: #1e293b; color: #e2e8f0; border-bottom-left-radius: 4px; }
  .chat-typing { color: #6366f1; font-size: 20px; letter-spacing: 4px; }
  .source-bubbles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .source-bubble { position: relative; background: #1e293b; border: 1px solid #6366f1; border-radius: 99px; padding: 3px 10px; font-size: 11px; color: #6366f1; cursor: pointer; }
  .source-bubble:hover .source-tooltip { display: block; }
  .source-tooltip { display: none; position: absolute; bottom: 130%; left: 0; background: #1a1d27; border: 1px solid #2d3148; border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #e2e8f0; width: 280px; line-height: 1.5; z-index: 100; white-space: normal; }
</style>
</head>
<body>

<header>
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#6366f1" stroke-width="2"/><path d="M8 12h8M12 8v8" stroke="#6366f1" stroke-width="2" stroke-linecap="round"/></svg>
  <h1>Meeting Bot Agent</h1>
  <span>LIVE</span>
</header>

<nav>
  <button class="active" onclick="showPage('schedule')">🤖 Schedule Bot</button>
  <button onclick="showPage('insights')">💡 Insights</button>
  <button onclick="showPage('search')">🔍 Search</button>
</nav>

<!-- SCHEDULE PAGE -->
<div id="page-schedule" class="page active">
  <div class="card">
    <h2>Schedule a Meeting Bot</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Meeting URL</label>
        <input id="meeting-url" type="text" placeholder="https://zoom.us/j/..." />
      </div>
      <div class="form-group">
        <label>Bot Name</label>
        <input id="bot-name" type="text" value="Meeting Bot" />
      </div>
    </div>
    <button class="btn" onclick="scheduleBot()">Join Meeting</button>
    <div id="schedule-msg"></div>
  </div>

  <div class="card" id="bot-status-card" style="display:none">
    <h2>Bot Status</h2>
    <div id="bot-status-content"></div>
  </div>

  <div class="card">
    <h2>Recent Meetings</h2>
    <ul class="meeting-list" id="meeting-list">
      <li style="color:#94a3b8;font-size:13px">No meetings yet</li>
    </ul>
  </div>
</div>

<!-- INSIGHTS PAGE -->
<div id="page-insights" class="page">
  <div class="card">
    <h2>Post-Call Insights</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Select Meeting</label>
        <select id="insights-meeting-id" onchange="syncInsightsId()">
          <option value="">Loading meetings...</option>
        </select>
      </div>
      <div class="form-group" style="display:flex;align-items:flex-end;gap:8px">
        <button class="btn" onclick="loadInsights()">Load Insights</button>
        <button class="btn btn-outline" onclick="generateInsights()">Generate</button>
      </div>
    </div>
    <div id="insights-msg"></div>
  </div>

  <div id="insights-result" style="display:none">
    <div class="card">
      <div class="insight-section">
        <h3>Summary</h3>
        <p id="ins-summary"></p>
      </div>
    </div>
    <div class="card">
      <div class="insight-section">
        <h3>Key Decisions</h3>
        <div id="ins-decisions"></div>
      </div>
    </div>
    <div class="card">
      <div class="insight-section">
        <h3>Action Items</h3>
        <div id="ins-actions"></div>
      </div>
      <div class="insight-section" style="margin-top:16px">
        <h3>Topics</h3>
        <div id="ins-topics"></div>
      </div>
    </div>
    <div class="card">
      <div class="insight-section">
        <h3>Risks</h3>
        <div id="ins-risks"></div>
      </div>
      <div class="insight-section" style="margin-top:16px">
        <h3>Sentiment</h3>
        <div id="ins-sentiment" class="sentiment"></div>
      </div>
    </div>
  </div>
</div>

<!-- CHAT PAGE -->
<div id="page-search" class="page">
  <div class="card" style="display:flex;flex-direction:column;height:600px">
    <h2 style="margin-bottom:16px">💬 Meeting Chat</h2>
    <div id="chat-messages" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:16px;padding-right:4px"></div>
    <div style="display:flex;gap:8px">
      <input id="chat-input" type="text" placeholder="Ask anything about your meetings..."
        style="flex:1" onkeydown="if(event.key==='Enter')sendChat()" />
      <button class="btn" onclick="sendChat()" id="chat-send-btn">Send</button>
    </div>
  </div>
</div>

<script>
const API = '';
let apiMeetings = [];

async function loadMeetings() {
  try {
    const r = await fetch(`${API}/meetings`);
    apiMeetings = await r.json();
    renderMeetings();
    populateDropdowns();
  } catch(e) {}
}

function populateDropdowns() {
  const sel = document.getElementById('insights-meeting-id');
  const current = sel.value;
  if (!apiMeetings.length) {
    sel.innerHTML = '<option value="">No meetings yet</option>';
    return;
  }
  sel.innerHTML = apiMeetings.map(m =>
    `<option value="${m.meeting_id}">${m.bot_name} — ${m.meeting_id} (${m.status})</option>`
  ).join('');
  // Restore selection if still valid
  if (current && apiMeetings.find(m => m.meeting_id === current)) sel.value = current;
}

// Auto-refresh meetings every 10s
setInterval(loadMeetings, 10000);

function syncInsightsId() {
  // Hide old insights when user picks a different meeting
  document.getElementById('insights-result').style.display = 'none';
  setMsg('insights-msg', '', '');
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'schedule') renderMeetings();
  if (name === 'insights') { loadMeetings(); }
}

function renderMeetings() {
  const list = document.getElementById('meeting-list');
  if (!apiMeetings.length) { list.innerHTML = '<li style="color:#94a3b8;font-size:13px">No meetings yet</li>'; return; }
  list.innerHTML = apiMeetings.map(m => `
    <li class="meeting-item">
      <div class="info">
        <div class="id">${m.meeting_id}</div>
        <div class="url">${m.meeting_url}</div>
      </div>
      <div class="actions">
        <button class="btn btn-outline" style="font-size:12px;padding:6px 12px"
          onclick="goToInsights('${m.meeting_id}')">Insights</button>
      </div>
    </li>`).join('');
}

function goToInsights(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-insights').classList.add('active');
  document.querySelectorAll('nav button')[1].classList.add('active');
  loadMeetings().then(() => {
    document.getElementById('insights-meeting-id').value = id;
  });
}

async function scheduleBot() {
  const url = document.getElementById('meeting-url').value.trim();
  const name = document.getElementById('bot-name').value.trim() || 'Meeting Bot';
  if (!url) { setMsg('schedule-msg', 'Please enter a meeting URL', 'error'); return; }

  setMsg('schedule-msg', '<span class="spinner"></span>Joining meeting...', '');
  try {
    const r = await fetch(`${API}/meetings/schedule`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({meeting_url: url, bot_name: name})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(JSON.stringify(data));
    setMsg('schedule-msg', `✅ Bot scheduled! Meeting ID: ${data.meeting_id}`, 'success');
    trackBotStatus(data.meeting_id);
    loadMeetings();
  } catch(e) {
    setMsg('schedule-msg', `Error: ${e.message}`, 'error');
  }
}

let statusInterval = null;

async function trackBotStatus(botId) {
  document.getElementById('bot-status-card').style.display = 'block';
  if (statusInterval) clearInterval(statusInterval);

  const update = async () => {
    try {
      const r = await fetch(`${API}/meetings/${botId}`);
      const d = await r.json();
      const state = d.status || 'unknown';
      const stateColors = {joining:'#60a5fa', in_call:'#4ade80', ended:'#9ca3af', post_processing:'#facc15'};
      const color = stateColors[state] || '#9ca3af';
      document.getElementById('bot-status-content').innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
          <span style="font-family:monospace;font-size:12px;color:#6366f1">${botId}</span>
          <span style="background:#1e293b;color:${color};padding:3px 10px;border-radius:99px;font-size:12px">${state}</span>
        </div>
        ${state === 'ended' ? '<div style="color:#4ade80;font-size:13px">✅ Meeting ended. Insights are being generated automatically...</div>' : ''}
        ${state === 'joining' ? '<div style="color:#94a3b8;font-size:13px">⏳ Bot is joining the meeting...</div>' : ''}
        ${state === 'in_call' ? '<div style="color:#94a3b8;font-size:13px">🎙️ Bot is in the meeting. End the call when done.</div>' : ''}
      `;
      if (state === 'ended') {
        clearInterval(statusInterval);
        loadMeetings();
        // Auto-navigate to insights after 35s
        setTimeout(() => {
          document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
          document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
          document.getElementById('page-insights').classList.add('active');
          document.querySelectorAll('nav button')[1].classList.add('active');
          loadMeetings().then(() => {
            document.getElementById('insights-meeting-id').value = botId;
            loadInsights();
          });
        }, 35000);
      }
    } catch(e) {}
  };

  await update();
  statusInterval = setInterval(update, 5000);
}

async function loadInsights() {
  const id = document.getElementById('insights-meeting-id').value;
  if (!id) { setMsg('insights-msg', 'Select a meeting', 'error'); return; }
  setMsg('insights-msg', '<span class="spinner"></span>Loading...', '');
  try {
    const r = await fetch(`${API}/meetings/${id}/insights`);
    const data = await r.json();
    if (data.status === 'not_ready') {
      setMsg('insights-msg', 'Insights not ready. Click Generate to create them.', 'error');
      return;
    }
    renderInsights(data);
    setMsg('insights-msg', '', '');
  } catch(e) {
    setMsg('insights-msg', `Error: ${e.message}`, 'error');
  }
}

async function generateInsights() {
  const id = document.getElementById('insights-meeting-id').value;
  if (!id) { setMsg('insights-msg', 'Select a meeting', 'error'); return; }
  setMsg('insights-msg', '<span class="spinner"></span>Generating insights with AI... (may take 30s)', '');
  try {
    await fetch(`${API}/meetings/${id}/insights/generate`, {method: 'POST'});
    setMsg('insights-msg', '⏳ Processing... Click Load Insights in 30 seconds.', 'success');
  } catch(e) {
    setMsg('insights-msg', `Error: ${e.message}`, 'error');
  }
}

function renderInsights(d) {
  document.getElementById('insights-result').style.display = 'block';
  document.getElementById('ins-summary').textContent = d.summary || 'N/A';
  document.getElementById('ins-decisions').innerHTML = (d.key_decisions || [])
    .map(dec => `<div class="tag">✓ ${dec}</div>`).join('') || '<span style="color:#94a3b8;font-size:13px">None</span>';
  document.getElementById('ins-actions').innerHTML = (d.action_items || [])
    .map(a => `<div class="action-item"><span class="owner">${a.owner}</span>: ${a.task}${a.due_date ? ` <span style="color:#94a3b8">(${a.due_date})</span>` : ''}</div>`).join('') || '<span style="color:#94a3b8;font-size:13px">None</span>';
  document.getElementById('ins-topics').innerHTML = (d.topics || [])
    .map(t => `<span class="tag">${t}</span>`).join('');
  document.getElementById('ins-risks').innerHTML = (d.risks || [])
    .map(r => `<div class="risk">⚠ ${r}</div>`).join('') || '<span style="color:#94a3b8;font-size:13px">None</span>';
  const sent = d.sentiment || {};
  const overall = sent.overall || 'neutral';
  document.getElementById('ins-sentiment').innerHTML =
    `<div class="sentiment-item"><span class="name">Overall </span><span class="val ${overall}">${overall}</span></div>` +
    Object.entries(sent.per_speaker || {}).map(([name, val]) =>
      `<div class="sentiment-item"><span class="name">${name} </span><span class="val ${val}">${val}</span></div>`
    ).join('');
}

// ── Chat ──────────────────────────────────────────────────────
let chatHistory = [];

function appendChatBubble(role, text, id) {
  const el = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = `chat-bubble chat-${role}`;
  if (id) div.id = id;
  div.textContent = text;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
  return div;
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const q = input.value.trim();
  if (!q) return;

  input.value = '';
  document.getElementById('chat-send-btn').disabled = true;

  chatHistory.push({role: 'user', content: q});
  appendChatBubble('user', q);

  const typingId = 'typing-' + Date.now();
  const typingEl = appendChatBubble('bot', '...', typingId);
  typingEl.classList.add('chat-typing');

  let fullText = '';
  let sources = [];
  try {
    const r = await fetch('/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages: chatHistory})
    });

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    typingEl.classList.remove('chat-typing');
    typingEl.textContent = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      const lines = decoder.decode(value).split('\n');
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6);
        if (data === '[DONE]') break;
        try {
          const chunk = JSON.parse(data);
          if (chunk.token) {
            fullText += chunk.token;
            typingEl.textContent = fullText;
            document.getElementById('chat-messages').scrollTop = 999999;
          }
          if (chunk.sources) sources = chunk.sources;
        } catch(e) {}
      }
    }

    // Render source bubbles
    if (sources.length) {
      const bubblesDiv = document.createElement('div');
      bubblesDiv.className = 'source-bubbles';
      sources.forEach((s, i) => {
        const b = document.createElement('div');
        b.className = 'source-bubble';
        b.innerHTML = `📎 ${s.speaker || 'Source'} ${i+1}
          <div class="source-tooltip"><strong>${s.speaker}</strong> · ${s.meeting_date}<br/>${s.text}</div>`;
        bubblesDiv.appendChild(b);
      });
      typingEl.appendChild(bubblesDiv);
    }
  } catch(e) {
    typingEl.textContent = 'Error: ' + e.message;
    typingEl.classList.remove('chat-typing');
  }

  if (fullText) chatHistory.push({role: 'assistant', content: fullText});
  document.getElementById('chat-send-btn').disabled = false;
  document.getElementById('chat-input').focus();
}

function setMsg(id, msg, type) {
  const el = document.getElementById(id);
  el.innerHTML = msg;
  el.className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
}

loadMeetings();
</script>
</body>
</html>
